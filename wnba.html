<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WNBA Prop Tool</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>" />

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #0b0f1a; color: #f8fafc; font-family: 'Outfit', sans-serif; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0b0f1a; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>

<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useCallback } = React;

const THRESHOLDS = ['10', '15', '18', '20', '25', '30'];
const TIER_RUNGS = {
  low:  ['10', '12', '15', '18', '20'],
  mid:  ['10', '15', '18', '20', '25', '30'],
  high: ['15', '20', '25', '30', '35', '40'],
};
const TIER_CUTOFFS = { highThreshold: '25', highMinP: 0.45, lowThreshold: '15', lowMaxP: 0.40 };
const ALL_THRESHOLDS = [...new Set(Object.values(TIER_RUNGS).flat())].sort((a, b) => +a - +b);
const TRACKED_BOOKS = ['draftkings', 'fanduel', 'betmgm', 'caesars', 'betrivers'];
const BOOK_ABBR = { draftkings: 'DK', fanduel: 'FD', betmgm: 'MGM', caesars: 'CZR', betrivers: 'BR' };
const ODDS_BASE = 'https://api.the-odds-api.com';
const LS_KEY_KEY = 'wnbaOddsApiKey';
const LS_CACHE_KEY = 'wnbaOddsCache';
const LS_BET_KEY = 'wnbaBetLog';

const BetLogger = (() => {
  const read = () => { try { return JSON.parse(localStorage.getItem(LS_BET_KEY)) ?? []; } catch(_) { return []; } };
  const write = (entries) => localStorage.setItem(LS_BET_KEY, JSON.stringify(entries));
  return {
    log(entry) {
      const entries = read();
      entries.push({ id: crypto.randomUUID(), timestamp: new Date().toISOString(), result: null, actualPts: null, ...entry });
      write(entries);
    },
    updateResult(id, actualPts) {
      const entries = read();
      const idx = entries.findIndex(e => e.id === id);
      if (idx === -1) return;
      entries[idx].result = actualPts >= parseInt(entries[idx].threshold) ? 'win' : 'loss';
      entries[idx].actualPts = actualPts;
      write(entries);
    },
    getAll: () => read(),
    getPending: () => read().filter(e => e.result === null),
    calibrationStats() {
      const resolved = read().filter(e => e.result !== null);
      if (resolved.length === 0) return [];
      const buckets = {};
      for (const e of resolved) {
        const key = Math.floor(e.modelP * 10) / 10;
        if (!buckets[key]) buckets[key] = { sumP: 0, wins: 0, n: 0 };
        buckets[key].sumP += e.modelP;
        buckets[key].wins += e.result === 'win' ? 1 : 0;
        buckets[key].n++;
      }
      return Object.entries(buckets)
        .sort(([a], [b]) => Number(a) - Number(b))
        .map(([key, { sumP, wins, n }]) => ({
          label: `${(+key * 100).toFixed(0)}–${(+key * 100 + 10).toFixed(0)}%`,
          predicted: sumP / n,
          hitRate: wins / n,
          n,
        }));
    },
  };
})();

const WNBA_STATS_BASE = 'https://stats.wnba.com/stats';

const ResultChecker = (() => {
  function rowsToObjects({ headers, rowSet }) {
    return rowSet.map(row => Object.fromEntries(headers.map((h, i) => [h, row[i]])));
  }

  async function wnbaFetch(path) {
    const res = await fetch(`${WNBA_STATS_BASE}${path}`, {
      headers: { Accept: 'application/json', Referer: 'https://www.wnba.com' },
    });
    if (!res.ok) throw new Error(`WNBA API ${res.status}`);
    return res.json();
  }

  function dateOnlyMs(d) {
    return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  }

  return {
    async check() {
      const pending = BetLogger.getPending();
      if (pending.length === 0) return { resolved: 0 };

      const allData = await wnbaFetch('/commonallplayers?LeagueID=10&Season=2026&IsOnlyCurrentSeason=1');
      const idMap = Object.fromEntries(
        rowsToObjects(allData.resultSets[0])
          .map(p => [normalizeName(p.DISPLAY_FIRST_LAST).toLowerCase(), p.PERSON_ID])
      );

      const byPlayer = {};
      for (const bet of pending) {
        (byPlayer[bet.player] ??= []).push(bet);
      }

      let resolved = 0;
      for (const [playerName, bets] of Object.entries(byPlayer)) {
        const playerId = idMap[normalizeName(playerName).toLowerCase()];
        if (!playerId) continue;

        let games;
        try {
          const logData = await wnbaFetch(
            `/playergamelog?PlayerID=${playerId}&Season=2026&SeasonType=Regular+Season&LeagueID=10`
          );
          games = rowsToObjects(logData.resultSets[0]);
        } catch (_) {
          continue;
        }

        const sorted = games
          .map(g => ({ ms: dateOnlyMs(new Date(g.GAME_DATE)), pts: parseInt(g.PTS) }))
          .sort((a, b) => a.ms - b.ms);

        for (const bet of bets) {
          const loggedMs = dateOnlyMs(new Date(bet.timestamp));
          const match = sorted.find(g => g.ms >= loggedMs);
          if (!match) continue;
          BetLogger.updateResult(bet.id, match.pts);
          resolved++;
        }
      }

      return { resolved };
    },
  };
})();

const NAME_OVERRIDES = {
  "A'ja Wilson": "Aja Wilson",
  "Skylar Diggins-Smith": "Skylar Diggins",
};

function normalizeName(name) {
  const trimmed = name.trim();
  const overridden = NAME_OVERRIDES[trimmed] ?? trimmed;
  return overridden.normalize('NFD').replace(/\p{Mn}/gu, '');
}

function matchThreshold(point) {
  const bin = String(Math.round(point + 0.5));
  return ALL_THRESHOLDS.includes(bin) ? bin : null;
}

function derivePlayerTier(thresholds) {
  if ((thresholds?.[TIER_CUTOFFS.highThreshold]?.p ?? 0) > TIER_CUTOFFS.highMinP) return 'high';
  if ((thresholds?.[TIER_CUTOFFS.lowThreshold]?.p ?? 1) < TIER_CUTOFFS.lowMaxP) return 'low';
  return 'mid';
}

function fmtOdds(price) {
  return price > 0 ? `+${price}` : `${price}`;
}

function americanToImplied(odds) {
  return odds < 0 ? -odds / (-odds + 100) : 100 / (odds + 100);
}

function calcEdge(modelP, over, under) {
  const rawOver = americanToImplied(over.price);
  if (!under) return { edge: modelP - rawOver, vigStripped: false };
  const rawUnder = americanToImplied(under.price);
  const vigFree = rawOver / (rawOver + rawUnder);
  return { edge: modelP - vigFree, vigStripped: true };
}

function ladderTier(odds) {
  if (odds >= 4000) return 'lotto';
  if (odds >= 1201) return 'top';
  if (odds >= 201) return 'middle';
  return 'base';
}

const TIER_STYLES = {
  base:   { bg: '#1e293b', color: '#64748b' },
  middle: { bg: '#1e3a5f', color: '#60a5fa' },
  top:    { bg: '#2d1b69', color: '#a78bfa' },
  lotto:  { bg: '#78350f', color: '#fbbf24' },
};

function TierBadge({ tier }) {
  const s = TIER_STYLES[tier];
  return (
    <span style={{
      fontSize: 8, fontWeight: 700, letterSpacing: 0.5,
      background: s.bg, color: s.color, borderRadius: 3,
      padding: '1px 4px', textTransform: 'uppercase', fontFamily: 'Outfit',
    }}>
      {tier}
    </span>
  );
}

function minutesAgo(isoStr) {
  const mins = Math.floor((Date.now() - new Date(isoStr).getTime()) / 60000);
  return mins === 0 ? 'just now' : `${mins}m ago`;
}

async function fetchOdds(apiKey) {
  const eventsRes = await fetch(`${ODDS_BASE}/v4/sports/basketball_wnba/events?apiKey=${apiKey}&dateFormat=iso`);
  if (!eventsRes.ok) throw new Error(`Events API ${eventsRes.status}`);
  const events = await eventsRes.json();

  const overMap = {};
  const underMap = {};
  const games = {};
  const playerGame = {};

  for (const event of events) {
    const oddsRes = await fetch(
      `${ODDS_BASE}/v4/sports/basketball_wnba/events/${event.id}/odds?apiKey=${apiKey}&markets=player_points_alternate,spreads,totals&regions=us&oddsFormat=american`
    );
    if (!oddsRes.ok) continue;
    const oddsJson = await oddsRes.json();

    const gameEntry = { homeTeam: event.home_team, awayTeam: event.away_team, commenceTime: event.commence_time };
    for (const bookmaker of (oddsJson.bookmakers ?? [])) {
      if (gameEntry.spread === undefined) {
        const spreadMarket = (bookmaker.markets ?? []).find(m => m.key === 'spreads');
        if (spreadMarket?.outcomes?.length) {
          const favorite = spreadMarket.outcomes.reduce((a, b) => a.point < b.point ? a : b);
          gameEntry.spread = { team: favorite.name, line: favorite.point };
        }
      }
      if (gameEntry.total === undefined) {
        const totalMarket = (bookmaker.markets ?? []).find(m => m.key === 'totals');
        const overOutcome = totalMarket?.outcomes?.find(o => o.name === 'Over');
        if (overOutcome) gameEntry.total = overOutcome.point;
      }
    }
    games[event.id] = gameEntry;

    for (const bookmaker of (oddsJson.bookmakers ?? [])) {
      if (!TRACKED_BOOKS.includes(bookmaker.key)) continue;
      const market = (bookmaker.markets ?? []).find(m => m.key === 'player_points_alternate');
      if (!market) continue;

      for (const outcome of (market.outcomes ?? [])) {
        if (outcome.name !== 'Over' && outcome.name !== 'Under') continue;
        const bin = matchThreshold(outcome.point);
        if (!bin) continue;
        const playerKey = normalizeName(outcome.description).toLowerCase();
        playerGame[playerKey] = event.id;
        const map = outcome.name === 'Over' ? overMap : underMap;
        if (!map[playerKey]) map[playerKey] = {};
        if (!map[playerKey][bin] || outcome.price > map[playerKey][bin].price) {
          map[playerKey][bin] = { price: outcome.price, book: BOOK_ABBR[bookmaker.key] };
        }
      }
    }
  }

  const players = {};
  for (const [pk, bins] of Object.entries(overMap)) {
    players[pk] = {};
    for (const [bin, over] of Object.entries(bins)) {
      players[pk][bin] = { over, under: underMap[pk]?.[bin] ?? null };
    }
  }
  return { players, games, playerGame };
}

function groupPlayersByGame(entries, oddsData) {
  if (!oddsData) return [{ gameId: null, game: null, entries }];

  const { players: playersOdds, games, playerGame } = oddsData;

  function hasPositiveEdge([name, playerData]) {
    const po = playersOdds?.[normalizeName(name).toLowerCase()];
    if (!po) return false;
    const rungs = TIER_RUNGS[derivePlayerTier(playerData.thresholds)];
    return rungs.some(t => {
      const entry = playerData.thresholds?.[t];
      const o = po[t];
      if (!entry || !o) return false;
      return calcEdge(entry.p, o.over, o.under).edge > 0;
    });
  }

  const groupMap = {};
  const ungrouped = [];

  for (const entry of entries) {
    const gameId = playerGame?.[normalizeName(entry[0]).toLowerCase()];
    if (gameId && games?.[gameId]) {
      (groupMap[gameId] ??= []).push(entry);
    } else {
      ungrouped.push(entry);
    }
  }

  const sortEntries = (arr) =>
    [...arr].sort((a, b) => {
      const diff = (hasPositiveEdge(a) ? 0 : 1) - (hasPositiveEdge(b) ? 0 : 1);
      return diff !== 0 ? diff : a[0].localeCompare(b[0]);
    });

  const result = Object.entries(groupMap)
    .sort(([aId], [bId]) =>
      new Date(games[aId].commenceTime) - new Date(games[bId].commenceTime)
    )
    .map(([gameId, groupEntries]) => ({
      gameId,
      game: games[gameId],
      entries: sortEntries(groupEntries),
    }));

  if (ungrouped.length > 0) result.push({ gameId: null, game: null, entries: ungrouped });
  return result;
}

function GameHeader({ game }) {
  const time = new Date(game.commenceTime).toLocaleString('en-US', {
    hour: 'numeric', minute: '2-digit', hour12: true,
  });
  const spreadStr = game.spread
    ? ` · ${game.spread.team} ${game.spread.line > 0 ? '+' : ''}${game.spread.line}`
    : '';
  const totalStr = game.total != null ? ` · O/U ${game.total}` : '';

  return (
    <div style={{
      gridColumn: '1 / -1',
      padding: '10px 4px 6px',
      fontFamily: 'Outfit', fontSize: 13, fontWeight: 600,
      color: '#94a3b8', letterSpacing: 0.3,
      borderBottom: '1px solid #1e293b',
      marginBottom: 4,
    }}>
      {game.awayTeam} @ {game.homeTeam}
      <span style={{ fontWeight: 400, color: '#64748b', fontFamily: 'JetBrains Mono', fontSize: 12 }}>
        {` · ${time}${spreadStr}${totalStr}`}
      </span>
    </div>
  );
}

function pColor(p) {
  if (p >= 0.70) return '#4ade80';
  if (p >= 0.55) return '#facc15';
  if (p >= 0.40) return '#fb923c';
  return '#f87171';
}

function fmt(p) { return (p * 100).toFixed(1) + '%'; }
function pToAmerican(p) {
  if (p >= 0.5) return Math.round(-(p / (1 - p)) * 100);
  return Math.round(((1 - p) / p) * 100);
}
function fmtAmerican(p) { const v = pToAmerican(p); return (v > 0 ? '+' : '') + v; }

function calcParlayEdge(legs) {
  const modelP = legs.reduce((acc, l) => acc * l.modelP, 1);
  const fairOdds = pToAmerican(modelP);
  const hasAllOdds = legs.every(l => l.bookOver != null);
  if (!hasAllOdds) return { modelP, fairOdds, bookImpliedP: null, edge: null };
  const bookImpliedP = legs.reduce((acc, l) => acc * americanToImplied(l.bookOver.price), 1);
  return { modelP, fairOdds, bookImpliedP, edge: modelP - bookImpliedP };
}

function ParlayBuilderPanel({ legs, onRemove, onClear }) {
  if (legs.length === 0) return null;
  const { modelP, fairOdds, bookImpliedP, edge } = calcParlayEdge(legs);

  return (
    <div style={{ marginBottom: 20, border: '1px solid #334155', borderRadius: 10, overflow: 'hidden' }}>
      <div style={{
        background: 'rgba(15,23,42,0.8)', padding: '10px 16px',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      }}>
        <span style={{ fontFamily: 'Outfit', fontWeight: 700, fontSize: 14, color: '#f8fafc' }}>
          Parlay Builder
        </span>
        <button onClick={onClear} style={{
          background: 'none', border: '1px solid #334155', borderRadius: 5,
          color: '#64748b', fontFamily: 'Outfit', fontSize: 11,
          padding: '2px 10px', cursor: 'pointer',
        }}>
          Clear
        </button>
      </div>
      <div style={{ background: 'rgba(15,23,42,0.4)' }}>
        {legs.map((leg, i) => (
          <div key={i} style={{
            display: 'flex', alignItems: 'center', gap: 10,
            padding: '7px 16px', borderBottom: '1px solid #0f172a',
          }}>
            <span style={{ flex: 1, fontFamily: 'Outfit', fontSize: 13, textTransform: 'capitalize', color: '#f8fafc' }}>
              {leg.player}
            </span>
            <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: '#94a3b8', minWidth: 32 }}>
              {leg.threshold}+
            </span>
            <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: pColor(leg.modelP), minWidth: 44, textAlign: 'right' }}>
              {fmt(leg.modelP)}
            </span>
            <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: '#93c5fd', minWidth: 44, textAlign: 'right' }}>
              {leg.bookOver ? fmtOdds(leg.bookOver.price) : '—'}
            </span>
            <button onClick={() => onRemove(i)} style={{
              background: 'none', border: 'none', color: '#475569',
              cursor: 'pointer', fontSize: 14, lineHeight: 1, padding: '0 4px',
            }}>×</button>
          </div>
        ))}
        <div style={{
          display: 'flex', alignItems: 'center', gap: 10,
          padding: '9px 16px', borderTop: '1px solid #1e293b',
          background: 'rgba(15,23,42,0.6)',
        }}>
          <span style={{ flex: 1, fontFamily: 'Outfit', fontSize: 12, fontWeight: 600, color: '#64748b' }}>
            {legs.length}-leg parlay
          </span>
          <span style={{ fontFamily: 'JetBrains Mono', fontSize: 13, fontWeight: 600, color: pColor(modelP), minWidth: 44, textAlign: 'right' }}>
            {fmt(modelP)}
          </span>
          <span style={{ fontFamily: 'JetBrains Mono', fontSize: 13, fontWeight: 600, color: '#93c5fd', minWidth: 44, textAlign: 'right' }}>
            {fmtAmerican(modelP)}
          </span>
          <span style={{
            fontFamily: 'JetBrains Mono', fontSize: 13, fontWeight: 600, minWidth: 44, textAlign: 'right',
            color: edge == null ? '#475569' : edge > 0 ? '#4ade80' : '#f87171',
          }}>
            {edge == null ? '—' : (edge > 0 ? '+' : '') + (edge * 100).toFixed(1) + '%'}
          </span>
          <div style={{ width: 22 }} />
        </div>
      </div>
    </div>
  );
}

function PlayerCard({ name, data, playerOdds, rungs, onLog, onAddLeg, parlayLegs, showOdds }) {
  const [logged, setLogged] = useState(new Set());
  const limited = data.confidence === 'limited';

  const edgeByThreshold = {};
  if (playerOdds) {
    for (const t of rungs) {
      const entry = data.thresholds?.[t];
      const o = playerOdds[t];
      if (entry && o) edgeByThreshold[t] = calcEdge(entry.p, o.over, o.under);
    }
  }
  const hasAnyPositive = Object.values(edgeByThreshold).some(e => e.edge > 0);

  return (
    <div style={{
      background: 'rgba(15,23,42,0.6)',
      border: hasAnyPositive ? '1px solid #166534' : limited ? '1px solid #78350f' : '1px solid #1e293b',
      borderRadius: 10,
      padding: '14px 16px',
      opacity: limited ? 0.75 : 1,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
        <span style={{ fontFamily: 'Outfit', fontWeight: 700, fontSize: 15, textTransform: 'capitalize', letterSpacing: 0.2 }}>
          {name}
        </span>
        {limited && (
          <span style={{
            fontSize: 10, fontWeight: 600, letterSpacing: 0.5,
            background: '#78350f', color: '#fbbf24', borderRadius: 4,
            padding: '2px 6px', textTransform: 'uppercase',
          }}>
            Limited
          </span>
        )}
      </div>
      <table style={{ width: '100%', borderCollapse: 'collapse' }}>
        <thead>
          <tr>
            <th style={{ width: 28 }} />
            {rungs.map(t => (
              <th key={t} style={{
                fontFamily: 'Outfit', fontSize: 11, fontWeight: 600, color: '#94a3b8',
                textAlign: 'center', paddingBottom: 4, borderBottom: '1px solid #1e293b',
              }}>
                {t}+
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style={{ fontSize: 9, color: '#475569', fontFamily: 'Outfit', paddingRight: 4, verticalAlign: 'middle' }}>P</td>
            {rungs.map(t => {
              const entry = data.thresholds?.[t];
              const isPositive = edgeByThreshold[t]?.edge > 0;
              if (!entry) return <td key={t} style={{ textAlign: 'center', color: '#475569', fontFamily: 'JetBrains Mono', fontSize: 13 }}>—</td>;
              const alreadyAdded = parlayLegs.some(l => l.player === name && l.threshold === t);
              const parlayFull = parlayLegs.length >= 4;
              return (
                <td key={t} style={{
                  textAlign: 'center', paddingTop: 6,
                  background: isPositive ? 'rgba(74,222,128,0.07)' : 'transparent',
                }}>
                  <div style={{ fontFamily: 'JetBrains Mono', fontWeight: 600, fontSize: 14, color: pColor(entry.p) }}>
                    {showOdds ? fmtAmerican(entry.p) : fmt(entry.p)}
                  </div>
                  <div style={{ fontFamily: 'JetBrains Mono', fontSize: 10, color: '#64748b', marginTop: 2 }}>
                    n={entry.n_current}
                  </div>
                  <button
                    onClick={() => onAddLeg({ player: name, threshold: t, modelP: entry.p, bookOver: playerOdds?.[t]?.over ?? null })}
                    disabled={alreadyAdded || parlayFull}
                    style={{
                      marginTop: 3, background: alreadyAdded ? '#14532d' : 'transparent',
                      border: `1px solid ${alreadyAdded ? '#15803d' : '#334155'}`,
                      borderRadius: 3, color: alreadyAdded ? '#4ade80' : parlayFull ? '#1e293b' : '#475569',
                      fontFamily: 'JetBrains Mono', fontSize: 10,
                      padding: '0px 5px', cursor: alreadyAdded || parlayFull ? 'default' : 'pointer',
                      lineHeight: 1.6,
                    }}
                  >
                    {alreadyAdded ? '✓' : '+'}
                  </button>
                </td>
              );
            })}
          </tr>
          {playerOdds && (
            <tr>
              <td style={{ fontSize: 9, color: '#475569', fontFamily: 'Outfit', paddingRight: 4, verticalAlign: 'middle' }}>odds</td>
              {rungs.map(t => {
                const o = playerOdds[t];
                const isPositive = edgeByThreshold[t]?.edge > 0;
                if (!o) return <td key={t} />;
                return (
                  <td key={t} style={{
                    textAlign: 'center', paddingTop: 4,
                    background: isPositive ? 'rgba(74,222,128,0.07)' : 'transparent',
                  }}>
                    <div style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: '#93c5fd', fontWeight: 600 }}>
                      {fmtOdds(o.over.price)}
                    </div>
                    <div style={{ fontFamily: 'JetBrains Mono', fontSize: 9, color: '#475569', marginTop: 1 }}>
                      {o.over.book}
                    </div>
                    <div style={{ marginTop: 2 }}>
                      <TierBadge tier={ladderTier(o.over.price)} />
                    </div>
                  </td>
                );
              })}
            </tr>
          )}
          {playerOdds && (
            <tr>
              <td style={{ fontSize: 9, color: '#475569', fontFamily: 'Outfit', paddingRight: 4, verticalAlign: 'middle' }}>edge</td>
              {rungs.map(t => {
                const info = edgeByThreshold[t];
                if (!info) return <td key={t} />;
                const { edge, vigStripped } = info;
                const isPositive = edge > 0;
                return (
                  <td key={t} style={{
                    textAlign: 'center', paddingTop: 4,
                    background: isPositive ? 'rgba(74,222,128,0.07)' : 'transparent',
                  }}>
                    <div style={{
                      fontFamily: 'JetBrains Mono', fontSize: 11, fontWeight: 600,
                      color: isPositive ? '#4ade80' : edge < -0.05 ? '#f87171' : '#64748b',
                    }}>
                      {isPositive ? '+' : ''}{(edge * 100).toFixed(1)}%
                    </div>
                    {!vigStripped && (
                      <div style={{ fontSize: 8, color: '#92400e', fontFamily: 'Outfit' }}>raw</div>
                    )}
                  </td>
                );
              })}
            </tr>
          )}
          {playerOdds && (
            <tr>
              <td style={{ fontSize: 9, color: '#475569', fontFamily: 'Outfit', paddingRight: 4, verticalAlign: 'middle' }}>log</td>
              {rungs.map(t => {
                const entry = data.thresholds?.[t];
                const o = playerOdds[t];
                const canLog = entry && o;
                const wasLogged = logged.has(t);
                return (
                  <td key={t} style={{ textAlign: 'center', paddingTop: 4 }}>
                    {canLog && (
                      <button
                        onClick={() => {
                          const rawOver = americanToImplied(o.over.price);
                          const bookImpliedP = o.under
                            ? rawOver / (rawOver + americanToImplied(o.under.price))
                            : rawOver;
                          onLog({ player: name, threshold: t, modelP: entry.p, bookImpliedP, odds: o.over.price, book: o.over.book });
                          setLogged(prev => new Set([...prev, t]));
                        }}
                        style={{
                          background: wasLogged ? '#14532d' : '#1e293b',
                          border: `1px solid ${wasLogged ? '#15803d' : '#334155'}`,
                          borderRadius: 4, color: wasLogged ? '#4ade80' : '#94a3b8',
                          fontFamily: 'JetBrains Mono', fontSize: 11,
                          padding: '1px 7px', cursor: 'pointer', lineHeight: 1.6,
                        }}
                      >
                        {wasLogged ? '✓' : '+'}
                      </button>
                    )}
                  </td>
                );
              })}
            </tr>
          )}
        </tbody>
      </table>
    </div>
  );
}

function BetLogPanel({ log, onUpdate, onCheckResults }) {
  const [open, setOpen] = useState(false);
  const [inputs, setInputs] = useState({});
  const [checking, setChecking] = useState(false);
  const [checkStatus, setCheckStatus] = useState(null);

  async function handleCheck() {
    setChecking(true);
    setCheckStatus(null);
    try {
      const result = await onCheckResults();
      setCheckStatus({ resolved: result.resolved });
    } catch (e) {
      setCheckStatus({ error: e.message });
    } finally {
      setChecking(false);
    }
  }

  if (log.length === 0) return null;

  const pending = log.filter(e => e.result === null).length;
  const resolved = log.length - pending;

  return (
    <div style={{ marginTop: 20, border: '1px solid #1e293b', borderRadius: 10, overflow: 'hidden' }}>
      <div style={{ background: 'rgba(15,23,42,0.6)', display: 'flex', alignItems: 'center' }}>
        <button
          onClick={() => setOpen(o => !o)}
          style={{
            flex: 1, background: 'none', border: 'none',
            padding: '12px 16px', cursor: 'pointer', textAlign: 'left',
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          }}
        >
          <span style={{ fontFamily: 'Outfit', fontWeight: 600, fontSize: 14, color: '#f8fafc' }}>
            Bet Log
          </span>
          <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: '#64748b' }}>
            {pending} pending · {resolved} resolved {open ? '▲' : '▼'}
          </span>
        </button>
        {pending > 0 && (
          <div style={{ paddingRight: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
            {checkStatus && !checking && (
              <span style={{
                fontSize: 11, fontFamily: 'JetBrains Mono',
                color: checkStatus.error ? '#f87171' : '#4ade80',
              }}>
                {checkStatus.error ?? `${checkStatus.resolved} resolved`}
              </span>
            )}
            <button
              onClick={handleCheck}
              disabled={checking}
              style={{
                background: checking ? '#1e293b' : '#1d4ed8',
                border: 'none', borderRadius: 6, color: '#f8fafc',
                fontFamily: 'Outfit', fontWeight: 600, fontSize: 11,
                padding: '5px 12px', cursor: checking ? 'not-allowed' : 'pointer',
                opacity: checking ? 0.6 : 1, whiteSpace: 'nowrap',
              }}
            >
              {checking ? 'Checking…' : 'Check Results'}
            </button>
          </div>
        )}
      </div>
      {open && (
        <div style={{ maxHeight: 420, overflowY: 'auto', background: 'rgba(15,23,42,0.4)' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ borderBottom: '1px solid #1e293b' }}>
                {['Time', 'Player', 'Pts+', 'Model', 'Impl', 'Edge', 'Odds', 'Book', 'Result', ''].map(h => (
                  <th key={h} style={{
                    padding: '7px 10px', color: '#64748b', fontWeight: 600,
                    textAlign: 'left', fontSize: 11, fontFamily: 'Outfit',
                  }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {log.map(entry => {
                const edge = entry.modelP - entry.bookImpliedP;
                return (
                  <tr key={entry.id} style={{ borderBottom: '1px solid #0f172a' }}>
                    <td style={{ padding: '7px 10px', color: '#475569', fontSize: 11, fontFamily: 'JetBrains Mono' }}>
                      {new Date(entry.timestamp).toLocaleString('en-US', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' })}
                    </td>
                    <td style={{ padding: '7px 10px', color: '#f8fafc', fontFamily: 'Outfit', fontSize: 13, textTransform: 'capitalize' }}>
                      {entry.player}
                    </td>
                    <td style={{ padding: '7px 10px', color: '#94a3b8', fontFamily: 'JetBrains Mono', fontSize: 12 }}>
                      {entry.threshold}+
                    </td>
                    <td style={{ padding: '7px 10px', fontFamily: 'JetBrains Mono', fontSize: 12, color: pColor(entry.modelP) }}>
                      {fmt(entry.modelP)}
                    </td>
                    <td style={{ padding: '7px 10px', fontFamily: 'JetBrains Mono', fontSize: 12, color: '#94a3b8' }}>
                      {fmt(entry.bookImpliedP)}
                    </td>
                    <td style={{ padding: '7px 10px', fontFamily: 'JetBrains Mono', fontSize: 12, fontWeight: 600, color: edge > 0 ? '#4ade80' : '#f87171' }}>
                      {edge > 0 ? '+' : ''}{(edge * 100).toFixed(1)}%
                    </td>
                    <td style={{ padding: '7px 10px', fontFamily: 'JetBrains Mono', fontSize: 12, color: '#93c5fd' }}>
                      {fmtOdds(entry.odds)}
                    </td>
                    <td style={{ padding: '7px 10px', fontFamily: 'JetBrains Mono', fontSize: 12, color: '#64748b' }}>
                      {entry.book}
                    </td>
                    <td style={{ padding: '7px 10px' }}>
                      {entry.result === null ? (
                        <span style={{ color: '#475569', fontFamily: 'Outfit', fontSize: 11 }}>pending</span>
                      ) : (
                        <span style={{ fontFamily: 'JetBrains Mono', fontWeight: 600, fontSize: 12, color: entry.result === 'win' ? '#4ade80' : '#f87171' }}>
                          {entry.result === 'win' ? 'WIN' : 'LOSS'} ({entry.actualPts})
                        </span>
                      )}
                    </td>
                    <td style={{ padding: '7px 10px' }}>
                      {entry.result === null && (
                        <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                          <input
                            type="number"
                            placeholder="pts"
                            value={inputs[entry.id] ?? ''}
                            onChange={e => setInputs(prev => ({ ...prev, [entry.id]: e.target.value }))}
                            style={{
                              width: 46, background: '#0b0f1a', border: '1px solid #334155',
                              borderRadius: 4, padding: '2px 5px', color: '#f8fafc',
                              fontFamily: 'JetBrains Mono', fontSize: 11, outline: 'none',
                            }}
                          />
                          <button
                            onClick={() => {
                              const val = parseFloat(inputs[entry.id]);
                              if (isNaN(val)) return;
                              onUpdate(entry.id, val);
                              setInputs(prev => { const n = { ...prev }; delete n[entry.id]; return n; });
                            }}
                            style={{
                              background: '#1d4ed8', border: 'none', borderRadius: 4,
                              color: '#f8fafc', fontFamily: 'Outfit', fontSize: 11,
                              padding: '2px 8px', cursor: 'pointer',
                            }}
                          >
                            ✓
                          </button>
                        </div>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function CalibrationPanel({ log }) {
  const stats = BetLogger.calibrationStats();
  if (stats.length === 0) return null;
  const pending = log.filter(e => e.result === null).length;

  return (
    <div style={{ marginTop: 12, border: '1px solid #1e293b', borderRadius: 10, overflow: 'hidden' }}>
      <div style={{ background: 'rgba(15,23,42,0.6)', padding: '10px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span style={{ fontFamily: 'Outfit', fontWeight: 600, fontSize: 14, color: '#f8fafc' }}>Calibration</span>
        {pending > 0 && (
          <span style={{ fontFamily: 'JetBrains Mono', fontSize: 11, color: '#64748b' }}>
            {pending} pending — stats not final
          </span>
        )}
      </div>
      <div style={{ background: 'rgba(15,23,42,0.4)', overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ borderBottom: '1px solid #1e293b' }}>
              {['Model P', 'Predicted', 'Actual', 'n'].map(h => (
                <th key={h} style={{ padding: '7px 16px', color: '#64748b', fontWeight: 600, textAlign: 'left', fontSize: 11, fontFamily: 'Outfit' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {stats.map(({ label, predicted, hitRate, n }) => {
              const diff = hitRate - predicted;
              return (
                <tr key={label} style={{ borderBottom: '1px solid #0f172a' }}>
                  <td style={{ padding: '7px 16px', color: '#94a3b8', fontFamily: 'JetBrains Mono', fontSize: 12 }}>{label}</td>
                  <td style={{ padding: '7px 16px', color: '#94a3b8', fontFamily: 'JetBrains Mono', fontSize: 12 }}>{(predicted * 100).toFixed(1)}%</td>
                  <td style={{ padding: '7px 16px', fontFamily: 'JetBrains Mono', fontSize: 12, fontWeight: 600, color: Math.abs(diff) < 0.05 ? '#4ade80' : diff > 0 ? '#93c5fd' : '#f87171' }}>
                    {(hitRate * 100).toFixed(1)}%
                  </td>
                  <td style={{ padding: '7px 16px', color: '#475569', fontFamily: 'JetBrains Mono', fontSize: 12 }}>{n}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function OddsPanel({ onRefresh, loading, error, lastFetched }) {
  const [apiKey, setApiKey] = useState(() => localStorage.getItem(LS_KEY_KEY) ?? '');
  const [showKey, setShowKey] = useState(false);

  const handleKeyChange = (e) => {
    setApiKey(e.target.value);
    localStorage.setItem(LS_KEY_KEY, e.target.value);
  };

  return (
    <div style={{
      background: 'rgba(15,23,42,0.6)', border: '1px solid #1e293b',
      borderRadius: 10, padding: '12px 16px', marginBottom: 20,
      display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 12,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flex: '1 1 260px' }}>
        <label style={{ fontSize: 12, color: '#94a3b8', fontFamily: 'Outfit', whiteSpace: 'nowrap' }}>
          Odds API Key
        </label>
        <input
          type={showKey ? 'text' : 'password'}
          value={apiKey}
          onChange={handleKeyChange}
          placeholder="Enter API key…"
          style={{
            flex: 1, background: '#0b0f1a', border: '1px solid #334155',
            borderRadius: 6, padding: '5px 10px', color: '#f8fafc',
            fontFamily: 'JetBrains Mono', fontSize: 12, outline: 'none',
          }}
        />
        <button
          onClick={() => setShowKey(s => !s)}
          style={{
            background: 'none', border: 'none', cursor: 'pointer',
            color: '#64748b', fontSize: 11, fontFamily: 'Outfit', padding: '0 4px',
          }}
        >
          {showKey ? 'hide' : 'show'}
        </button>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <button
          onClick={() => onRefresh(apiKey)}
          disabled={!apiKey || loading}
          style={{
            background: loading ? '#1e293b' : '#1d4ed8',
            border: 'none', borderRadius: 6, color: '#f8fafc',
            fontFamily: 'Outfit', fontWeight: 600, fontSize: 12,
            padding: '6px 14px', cursor: apiKey && !loading ? 'pointer' : 'not-allowed',
            opacity: !apiKey ? 0.4 : 1,
          }}
        >
          {loading ? 'Fetching…' : 'Refresh Odds'}
        </button>
        {lastFetched && !loading && (
          <span style={{ fontSize: 11, color: '#475569', fontFamily: 'JetBrains Mono' }}>
            {minutesAgo(lastFetched)}
          </span>
        )}
        {error && (
          <span style={{ fontSize: 11, color: '#f87171', fontFamily: 'Outfit' }}>
            {error}
          </span>
        )}
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [showOdds, setShowOdds] = useState(false);
  const [oddsData, setOddsData] = useState(null);
  const [oddsLastFetched, setOddsLastFetched] = useState(null);
  const [oddsLoading, setOddsLoading] = useState(false);
  const [oddsError, setOddsError] = useState(null);
  const [betLog, setBetLog] = useState(() => BetLogger.getAll());
  const [parlayLegs, setParlayLegs] = useState([]);

  useEffect(() => {
    fetch('wnba_data.json')
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(setData)
      .catch(e => setError(e.message));

    try {
      const cached = JSON.parse(localStorage.getItem(LS_CACHE_KEY));
      if (cached?.data && cached?.fetchedAt) {
        setOddsData(cached.data);
        setOddsLastFetched(cached.fetchedAt);
      }
    } catch (_) {}
  }, []);

  const handleLog = useCallback((entry) => {
    BetLogger.log(entry);
    setBetLog(BetLogger.getAll());
  }, []);

  const handleUpdate = useCallback((id, actualPts) => {
    BetLogger.updateResult(id, actualPts);
    setBetLog(BetLogger.getAll());
  }, []);

  const handleCheckResults = useCallback(async () => {
    const result = await ResultChecker.check();
    setBetLog(BetLogger.getAll());
    return result;
  }, []);

  const handleAddLeg = useCallback((leg) => {
    setParlayLegs(prev => {
      if (prev.length >= 4) return prev;
      if (prev.some(l => l.player === leg.player && l.threshold === leg.threshold)) return prev;
      return [...prev, leg];
    });
  }, []);

  const handleRemoveLeg = useCallback((idx) => {
    setParlayLegs(prev => prev.filter((_, i) => i !== idx));
  }, []);

  const handleRefresh = useCallback(async (apiKey) => {
    setOddsLoading(true);
    setOddsError(null);
    try {
      const result = await fetchOdds(apiKey);
      const fetchedAt = new Date().toISOString();
      localStorage.setItem(LS_CACHE_KEY, JSON.stringify({ data: result, fetchedAt }));
      setOddsData(result);
      setOddsLastFetched(fetchedAt);
    } catch (e) {
      setOddsError(e.message);
    } finally {
      setOddsLoading(false);
    }
  }, []);

  if (error) return (
    <div style={{ padding: 40, textAlign: 'center', color: '#f87171', fontFamily: 'Outfit' }}>
      Failed to load wnba_data.json: {error}
    </div>
  );

  if (!data) return (
    <div style={{ padding: 40, textAlign: 'center', color: '#64748b', fontFamily: 'Outfit' }}>
      Loading…
    </div>
  );

  const { generated_at, ...players } = data;
  const entries = Object.entries(players).sort(([a], [b]) => a.localeCompare(b));
  const generatedDate = generated_at ? new Date(generated_at).toLocaleString() : null;
  const limitedCount = entries.filter(([, v]) => v.confidence === 'limited').length;

  return (
    <div style={{ maxWidth: 1200, margin: '0 auto', padding: '24px 16px' }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, marginBottom: 20 }}>
        <h1 style={{ margin: 0, fontSize: 22, fontWeight: 700, letterSpacing: -0.3 }}>
          WNBA Prop Tool
        </h1>
        <div style={{ display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>
          <span style={{ fontSize: 12, color: '#64748b', fontFamily: 'JetBrains Mono' }}>
            {entries.length} players · {limitedCount} limited
          </span>
          <button onClick={() => setShowOdds(v => !v)} style={{
            fontSize: 11, fontFamily: 'JetBrains Mono', fontWeight: 600, cursor: 'pointer',
            padding: '4px 10px', borderRadius: 5, border: '1px solid #334155',
            background: showOdds ? '#1e3a5f' : 'transparent',
            color: showOdds ? '#93c5fd' : '#64748b',
          }}>
            {showOdds ? 'odds' : '%'}
          </button>
          {generatedDate && (
            <span style={{ fontSize: 12, color: '#475569', fontFamily: 'JetBrains Mono' }}>
              updated {generatedDate}
            </span>
          )}
        </div>
      </div>

      <OddsPanel
        onRefresh={handleRefresh}
        loading={oddsLoading}
        error={oddsError}
        lastFetched={oddsLastFetched}
      />

      <ParlayBuilderPanel
        legs={parlayLegs}
        onRemove={handleRemoveLeg}
        onClear={() => setParlayLegs([])}
      />

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))', gap: 12 }}>
        {groupPlayersByGame(entries, oddsData).map(({ gameId, game, entries: groupEntries }) => (
          <React.Fragment key={gameId ?? '__ungrouped'}>
            {game && <GameHeader game={game} />}
            {groupEntries.map(([name, playerData]) => {
              const playerKey = normalizeName(name).toLowerCase();
              return (
                <PlayerCard
                  key={name}
                  name={name}
                  data={playerData}
                  playerOdds={oddsData?.players?.[playerKey] ?? null}
                  rungs={TIER_RUNGS[derivePlayerTier(playerData.thresholds)]}
                  onLog={handleLog}
                  onAddLeg={handleAddLeg}
                  parlayLegs={parlayLegs}
                  showOdds={showOdds}
                />
              );
            })}
          </React.Fragment>
        ))}
      </div>

      <BetLogPanel log={betLog} onUpdate={handleUpdate} onCheckResults={handleCheckResults} />
      <CalibrationPanel log={betLog} />

      <div style={{ marginTop: 32, padding: '12px 16px', background: 'rgba(15,23,42,0.4)', borderRadius: 8, border: '1px solid #1e293b' }}>
        <div style={{ fontSize: 11, color: '#475569', fontFamily: 'Outfit', lineHeight: 1.8 }}>
          <strong style={{ color: '#64748b' }}>Model:</strong> Beta-Binomial posterior · λ=0.9 recency decay ·
          {' '}<span style={{ color: '#78350f', background: 'rgba(120,53,15,0.2)', padding: '1px 5px', borderRadius: 3 }}>Limited</span>
          {' '}= fewer than 5 career games (prior-dominated) · Probabilities are points-scored thresholds ·
          {' '}<span style={{ color: '#93c5fd' }}>Blue</span> = best available over odds (DK / FD / MGM / CZR / BR) ·
          {' '}<span style={{ color: '#4ade80' }}>Green edge</span> = model P − vig-free implied (both sides) or raw over implied (one side, labeled <em>raw</em>) ·
          {' '}Tier badges: <span style={{ background: '#1e293b', color: '#64748b', borderRadius: 3, padding: '1px 4px', fontSize: 10 }}>base</span>
          {' '}<span style={{ background: '#1e3a5f', color: '#60a5fa', borderRadius: 3, padding: '1px 4px', fontSize: 10 }}>middle</span>
          {' '}<span style={{ background: '#2d1b69', color: '#a78bfa', borderRadius: 3, padding: '1px 4px', fontSize: 10 }}>top</span>
          {' '}<span style={{ background: '#78350f', color: '#fbbf24', borderRadius: 3, padding: '1px 4px', fontSize: 10 }}>lotto</span>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
